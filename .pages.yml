media: static/uploads
content:
  - name: sources
    label: Sources
    type: collection
    path: content/sources
    exclude: ["_index.md"]
    filename: "{primary}.md"
    view:
      fields: [title, author_year, source_type]
      primary: title
      search: [title, author_year, citation, source_type]
      sort: [title, source_type]
      default:
        sort: title
        order: asc
    fields:
      - { name: title, label: Short title, type: string, required: true }
      - { name: author_year, label: Author and year, type: string, required: true }
      - { name: citation, label: Full citation, type: text, required: true }
      - { name: source_url, label: URL, type: string }
      - { name: source_type, label: Source type, type: string, required: true }
      - name: thesis_numbers
        label: Referenced by theses
        type: string
        list: true
      - { name: draft, label: Draft, type: boolean, default: false }
  - name: theses
    label: Theses
    type: collection
    path: content/theses
    filename: "{fields.number}-{primary}.md"
    view:
      fields: [number, title, draft]
      primary: title
      sort: [number]
      default:
        sort: number
        order: asc
    fields:
      - { name: number, label: Number, type: number, required: true }
      - { name: title, label: Thesis title, type: string, required: true }
      - { name: summary, label: Short proposition, type: text, required: true }
      - name: traits
        label: Traits
        type: object
        list: true
        fields:
          - { name: label, label: Label, type: string }
          - { name: value, label: Value, type: string }
      - name: source_refs
        label: Sources
        type: reference
        options:
          collection: sources
          multiple: true
          search: "title,author_year,citation,source_type"
          value: "{name}"
          label: "{author_year} {title}"
      - name: related
        label: Related thesis numbers
        type: string
        list: true
      - { name: description, label: SEO description, type: text }
      - { name: draft, label: Draft, type: boolean, default: false }
      - { name: body, label: Full thesis, type: rich-text, required: true }
